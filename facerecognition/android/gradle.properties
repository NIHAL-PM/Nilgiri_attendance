# Configured for cloud build environments (Codespaces / GitHub Actions)
# -Xmx2048m prevents Linux OOM killer from killing the Gradle Daemon on low-memory VMs
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.parallel=false

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
