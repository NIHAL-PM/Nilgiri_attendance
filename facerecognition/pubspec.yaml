name: pulseattend
description: "PulseAttend — AI-powered biometric attendance platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Live camera preview
  camera: ^0.11.0+1

  # Runtime permissions (camera, location)
  permission_handler: ^11.3.1

  # Real GPS for geofence
  geolocator: ^13.0.2

  # Smooth micro-animations
  flutter_animate: ^4.5.0

  # Skeleton loading shimmer
  shimmer: ^3.0.0

  # Date/time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
