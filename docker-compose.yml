version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pulse_attend_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pulse_attend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse_attend_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/pulse_attend
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - SIMILARITY_THRESHOLD=0.75
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
