name: PulseAttend – Build & Release Flutter APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: client
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release

      # ── Upload APK as artifact on every push (for testing / PR review) ──
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-attend-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # ── Create a GitHub Release ONLY when a version tag is pushed ──────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "PulseAttend ${{ github.ref_name }}"
          body: |
            ## PulseAttend / VeriFace Biometric Attendance App ${{ github.ref_name }}

            ### What's Included
            - **On-device Face Verification**: MobileFaceNet TFLite 512-dim vector embedding (zero raw images sent to server).
            - **Google ML Kit Liveness Detection**: Blink / head-tilt challenge to prevent photo spoofing.
            - **Dark Fintech UI**: Glowing radar line scanner, oval face viewport overlay, glassmorphic event cards.
            - **Geofencing**: GPS boundary validation before attendance is accepted.
            - **JWT Authentication**: Secure token-based login with `flutter_secure_storage`.

            ### How to Install
            1. Download **app-release.apk** below.
            2. Enable **Install from Unknown Sources** in Android Settings → Security.
            3. Install and log in with your student credentials.

            > **Backend URL**: Update `ApiService.defaultBaseUrl` in `client/lib/services/api_service.dart` to point to your FastAPI server before building.
          draft: false
          prerelease: false
          make_latest: true
          files: client/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
