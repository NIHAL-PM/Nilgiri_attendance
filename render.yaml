services:
  - type: web
    name: pulseattend-backend
    runtime: docker
    dockercontext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    branch: new
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulseattend-db
          property: connectionString

databases:
  - name: pulseattend-db
    region: singapore
    plan: free
    databaseName: pulseattend
    user: pulseattend_user
